name: Publicar portal no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  construir:
    name: Construir portal
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar versão de produção
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar rotas diretas do Angular
        run: cp dist/aws-ucb-portal/browser/index.html dist/aws-ucb-portal/browser/404.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/aws-ucb-portal/browser

  publicar:
    name: Publicar site
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
